<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Howzatt! Cricket Scorekeeper - Match Summary</title>
    <link rel="stylesheet" href="base_styles.css">
    <link rel="stylesheet" href="summary.css">
</head>
<body>
    <div class="container">
        <h1>Howzatt! Cricket Scorekeeper</h1>
        
        <div class="summary-container">
            <h2>Match Summary</h2>
            
            <div class="match-details" id="matchDetails">
                <!-- Match details will be populated by JavaScript -->
            </div>
            
            <div class="result-container">
                <h3>Match Result</h3>
                <div class="result" id="matchResult">
                    <!-- Match result will be populated by JavaScript -->
                </div>
            </div>
            
            <div class="innings-summary" id="inningsSummary">
                <!-- Innings summary will be populated by JavaScript -->
            </div>
            
            <div class="navigation-buttons">
                <button id="newMatchBtn">Start New Match</button>
            </div>
        </div>
    </div>

    <script src="score.js"></script>
</body>
</html>
